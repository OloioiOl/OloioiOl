name: Waka Readme

on:
  schedule:
    - cron: '30 18 * * *' # 매일 03:30 KST
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      # anmol098/waka-readme-stats 는 매번 Docker Hub 의 :master 이미지를 받아 실행하므로
      # 액션 커밋 SHA 고정은 의미가 없다 → 실제 실행 이미지를 digest 로 고정한다.
      # 업데이트하려면 Actions 로그의 "Digest: sha256:..." 값으로 교체.
      - uses: docker://wakareadmestats/waka-readme-stats@sha256:717755f5f494290067bdff99b0232b35a68accdcc5b88d910632af2d026f6665
        env:
          INPUT_WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          INPUT_GH_TOKEN: ${{ secrets.GH_TOKEN }}
          INPUT_SHOW_LANGUAGE_PER_REPO: "True"
          INPUT_SHOW_UPDATED_DATE: "True"
          INPUT_SHOW_AI_CODING: "False"
          INPUT_SHOW_AI_CODE_TIME: "False"
          INPUT_SHOW_TOTAL_CODE_TIME: "False"
          INPUT_SHOW_PROFILE_VIEWS: "False"
          INPUT_SHOW_COMMIT: "False"
          INPUT_SHOW_DAYS_OF_WEEK: "False"
          INPUT_SHOW_LANGUAGE: "False"
          INPUT_SHOW_OS: "False"
          INPUT_SHOW_PROJECTS: "False"
          INPUT_SHOW_TIMEZONE: "False"
          INPUT_SHOW_EDITORS: "False"
          INPUT_SHOW_LINES_OF_CODE: "False"
          INPUT_SHOW_SHORT_INFO: "False"
          INPUT_SHOW_LOC_CHART: "False"
